services:
  app:
    build:
      context: .
      target: runtime
    container_name: pixelpro-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_PORT: 8787
    ports:
      - "${HOST_PORT:-8081}:8787"
    volumes:
      - pixelpro_data:/app/data
      - ./automation:/app/automation
    mem_limit: 1g
    memswap_limit: 2g
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/api/orders/queue').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    stop_grace_period: 20s

volumes:
  pixelpro_data:
    driver: local
